<!doctype html><meta charset="utf-8"><pre id="o">RUNNING</pre><script>(async()=>{const o=document.getElementById('o');try{const b64=(await fetch('../assets/catalog/user-sprite36.b64',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.text()})).trim();const img=new Image();img.onload=()=>o.textContent=JSON.stringify({pass:true,bytesApprox:Math.floor(b64.length*0.75),width:img.naturalWidth,height:img.naturalHeight},null,2);img.onerror=()=>o.textContent=JSON.stringify({pass:false,error:'JPEG_DECODE_FAILED'},null,2);img.src='data:image/jpeg;base64,'+b64}catch(e){o.textContent=JSON.stringify({pass:false,error:String(e)},null,2)}})()</script>
